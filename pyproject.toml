[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dengine-vit-pytorch"
version = "0.1.0"
description = "dEngine extension for lucidrains/vit-pytorch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dengine",
    "vit-pytorch",
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
include = ["dengine_vit_pytorch*"]

[tool.setuptools.data-files]
"share/dengine-vit-pytorch/configs" = [
  "configs/*.*",
  "configs/**/*.*"
]
